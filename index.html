<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="navbar">Student Dashboard</div>
<div id="nav"></div>

<div class="container">
  <div id="assignmentsView">
    <div class="card">
      <h3>Your Assignments</h3>
      <div id="alist"></div>
    </div>
  </div>

  <div id="contentView" class="hidden">
    <div id="content" class="card"></div>
  </div>
</div>

<script src="app.js"></script>
<script>
if (!session || session.role !== "student") {
  location.href = "index.html";
}

function renderAssignments() {
  const alist = document.getElementById("alist");
  alist.innerHTML = "";
  const assignments = (JSON.parse(localStorage.getItem("assignments")) || [])
    .filter(a => a.to === "all" || a.to === session.key);

  if (!assignments.length) {
    alist.innerHTML = `<p class="muted">No assignments available.</p>`;
    return;
  }

  assignments.forEach(a => {
    const card = document.createElement("div");
    card.className = "assign-card";
    card.innerHTML = `<strong>${a.title}</strong><br><a href="${a.url}" target="_blank">Open</a>`;
    alist.appendChild(card);
  });
}
renderAssignments();
</script>
</body>
</html>
