<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Decourly Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container" style="display:flex; justify-content:center; align-items:center; height:100vh;">
        <div class="card" style="width:350px; text-align:center;">
            <h1>DECOURLY</h1>
            <div id="loginForm">
                <input type="text" id="username" placeholder="Username (Your Name)">
                <div id="passArea" style="display:none;">
                    <input type="password" id="password" placeholder="Teacher Password">
                </div>
                <button onclick="handleLogin()" style="width:100%; margin-top:10px;">Enter</button>
            </div>
        </div>
    </div>

    <script>
        // List of people with Teacher/Admin access
        const teacherPasses = {
            "ayana": "ayana1062014",
            "aayan": "aayan1062014",
            "mivaan": "mivaan1062014",
            "ashree": "ashree1062014",
            "baibhav": "baibhav1062014",
            "bihan": "bihan1062014",
            "zyra": "zyra1062014"
        };

        // UI Logic to show password field only if they type a teacher name
        document.getElementById('username').addEventListener('input', (e) => {
            const name = e.target.value.toLowerCase().trim();
            document.getElementById('passArea').style.display = teacherPasses[name] ? 'block' : 'none';
        });

        function handleLogin() {
            const u = document.getElementById("username").value.toLowerCase().trim();
            const p = document.getElementById("password").value.trim();

            if (teacherPasses[u]) {
                // Teacher Login Path
                if (p === teacherPasses[u]) {
                    saveSession(u, "teacher");
                } else {
                    alert("Incorrect Teacher Password!");
                }
            } else if (u !== "") {
                // Student Login Path (No password required)
                saveSession(u, "student");
            }
        }

        function saveSession(user, role) {
            localStorage.setItem("session", JSON.stringify({
                key: user,
                role: role,
                name: user.toUpperCase()
            }));
            window.location.href = "app.html";
        }
    </script>
</body>
</html>
