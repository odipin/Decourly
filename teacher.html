<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><title>Livestudent Teacher</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="navbar">Livestudent Dashboard</div>
<div id="nav"></div>
<div class="container">
  <div id="assignmentsView">
    <div class="card">
      <h3>Create Assignment</h3>
      <select id="aSub" onchange="updateTargets()"><option value="ALL">Everyone</option></select>
      <select id="aTarget"></select>
      <input id="aTitle" placeholder="Title">
      <input id="aUrl" placeholder="Link">
      <button onclick="postA()" class="success">Send</button>
    </div> 
    <div id="list"></div>
  </div>
  <div id="contentView" class="hidden"><div id="content"></div></div>
</div>
<script src="app.js"></script>
<script>
  function updateTargets() {
    const sub = document.getElementById("aSub").value;
    const t = document.getElementById("aTarget");
    t.innerHTML = '<option value="all">Everyone in List</option>';
    const r = sub === "ALL" ? STUDENTS.map(s=>s.toLowerCase()) : (enrollment[sub] || []);
    r.forEach(k => t.innerHTML += `<option value="${k}">${k.toUpperCase()}</option>`);
  }
  function postA() {
    const a = JSON.parse(localStorage.getItem("assignments")) || [];
    const sub = document.getElementById("aSub").value;
    const target = document.getElementById("aTarget").value;
    a.push({ 
        title: document.getElementById("aTitle").value, 
        url: document.getElementById("aUrl").value,
        targets: target === "all" ? (sub === "ALL" ? STUDENTS.map(s=>s.toLowerCase()) : enrollment[sub]) : [target],
        by: session.key, id: Date.now() 
    });
    localStorage.setItem("assignments", JSON.stringify(a)); render();
  }
  function render() {
    const l = document.getElementById("list"); l.innerHTML = "";
    const a = JSON.parse(localStorage.getItem("assignments")) || [];
    a.filter(x => x.by === session.key).forEach((x, i) => {
      l.innerHTML += `<div class="card"><b>${x.title}</b> <button onclick="del(${i})" class="danger">X</button></div>`;
    });
  }
  function del(i) {
    const a = JSON.parse(localStorage.getItem("assignments"));
    a.splice(i, 1); localStorage.setItem("assignments", JSON.stringify(a)); render();
  }
  subjects.forEach(s => document.getElementById("aSub").innerHTML += `<option value="${s}">${s}</option>`);
  updateTargets(); render();
</script>
</body>
</html>
